name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # validate content against schemas, build both locales, check every link
      # and anchor, report translation status (never needs an API key)
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
